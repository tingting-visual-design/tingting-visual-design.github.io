<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婷婷视觉设计 | 作品集</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"微软雅黑",sans-serif;background:#f5f5f5;color:#333;line-height:1.6;}

        /* 导航栏 */
        nav{background:#fff;box-shadow:0 2px 8px #eee;position:sticky;top:0;z-index:99;}
        .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;}
        .logo{font-size:22px;font-weight:bold;color:#222;text-decoration:none;}
        .nav-menu{display:flex;gap:30px;}
        .nav-menu a{text-decoration:none;color:#555;}
        .nav-menu a:hover{color:#000;}

        /* 头部横幅 */
        .banner{background:#fff;padding:60px 20px;text-align:center;}
        .banner h1{font-size:36px;margin-bottom:10px;}
        .banner p{color:#777;font-size:16px;}

        /* 容器通用 */
        .container{max-width:1200px;margin:60px auto;padding:0 20px;}
        .title{font-size:24px;margin-bottom:30px;border-left:4px solid #333;padding-left:15px;}

        /* 作品网格 */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px;}
        .card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px #eee;transition:0.3s;}
        .card:hover{transform:translateY(-5px);}
        .card-img{height:180px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;}
        .card-text{padding:15px;}
        .card-text h3{margin-bottom:8px;font-size:16px;}
        .tag{display:inline-block;background:#f0f0f0;padding:3px 10px;border-radius:20px;font-size:12px;color:#666;margin-right:5px;}

        /* 页脚 */
        footer{text-align:center;padding:40px;color:#999;font-size:14px;background:#fff;margin-top:60px;}
    </style>
</head>
<body>

<!-- 导航栏 以后随时可以改这里 -->
<nav>
    <div class="nav-wrap">
        <a href="index.html" class="logo">婷婷视觉设计</a>
        <div class="nav-menu">
            <a href="#school">校园作品</a>
            <a href="#work">工作作品</a>
            <a href="#poster">海报设计</a>
            <a href="#product">产品设计</a>
            <a href="#aigc">AIGC创作</a>
        </div>
    </div>
</nav>

<!-- 首页横幅 -->
<section class="banner">
    <h1>欢迎来到我的设计作品集</h1>
    <p>视觉传达设计 | 电商美工 · 产品视觉 · 海报创意 · AIGC视觉</p>
</section>

<!-- 校园作品板块 -->
<section class="container" id="school">
    <h2 class="title">📚 校园作品</h2>
    <div class="grid">
        <div class="card">
            <div class="card-img">作品图位置</div>
            <div class="card-text">
                <h3>课程品牌VI设计</h3>
                <span class="tag">校园</span>
                <span class="tag">品牌设计</span>
            </div>
        </div>
    </div>
</section>

<!-- 工作作品板块 -->
<section class="container" id="work">
    <h2 class="title">💼 工作作品</h2>
    <div class="grid">
        <div class="card">
            <div class="card-img">作品图位置</div>
            <div class="card-text">
                <h3>外贸工艺品视觉主图</h3>
                <span class="tag">工作</span>
                <span class="tag">电商设计</span>
            </div>
        </div>
    </div>
</section>

<!-- 海报设计板块 -->
<section class="container" id="poster">
    <h2 class="title">🎨 海报设计</h2>
    <div class="grid">
        <div class="card">
            <div class="card-img">作品图位置</div>
            <div class="card-text">
                <h3>创意活动海报</h3>
                <span class="tag">海报</span>
            </div>
        </div>
    </div>
</section>

<!-- 产品设计板块 -->
<section class="container" id="product">
    <h2 class="title">📦 产品视觉设计</h2>
    <div class="grid">
        <div class="card">
            <div class="card-img">作品图位置</div>
            <div class="card-text">
                <h3>工艺品造型视觉设计</h3>
                <span class="tag">产品</span>
            </div>
        </div>
    </div>
</section>

<!-- AIGC创作板块 -->
<section class="container" id="aigc">
    <h2 class="title">🤖 AIGC 视觉创作</h2>
    <div class="grid">
        <div class="card">
            <div class="card-img">作品图位置</div>
            <div class="card-text">
                <h3>AI人物/IP形象设计</h3>
                <span class="tag">AIGC</span>
            </div>
        </div>
    </div>
</section>

<footer>
    © 2026 婷婷视觉设计作品集 · 所有作品持续更新中
</footer>

</body>
</html>
